  <text x="40.0" y="865.0" font-size="17" fill="#586676" text-anchor="start">BasicLayer：有先验且group&gt;1时先HIM跨注意力；之后LN+先验调制MDTA+残差、LN+先验调制门控FFN+残差。</text>
  <text x="40.0" y="902.0" font-size="17" fill="#586676" text-anchor="start">task特征F1/F2/F3 = decoder1/2/3输出（96/96/192）。图中的编号是尺度编号，不是循环轮次。</text>
  <text x="40.0" y="941.0" font-size="17" fill="#586676" text-anchor="start">第二轮仅通过两个临时forward hook加入残差；finally移除。先验参数冻结但历史候选训练时保留输入梯度。</text>
